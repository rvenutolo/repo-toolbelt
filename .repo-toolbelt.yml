check-workflow-hermetic:
  exempt:
    - step: .github/actions/setup/action.yml::root-devshell
      reason: It roots the devShell closure for the Nix cache, using the nix the installer action put on PATH.
    - step: .github/workflows/ci.yml::verdict
      reason: It only compares the needed jobs' results, and its job installs no Nix.
    - step: .github/workflows/ci.yml::pin
      reason: It reads one line of the example workflow, and its job installs no Nix.
    - step: .github/workflows/lint.yml::check-pin
      reason: It runs on consumers' runners, which have no Nix.
    - step: .github/workflows/lint.yml::verify-provenance
      reason: It runs on consumers' runners, which have no Nix.
    - step: .github/workflows/lint.yml::plan
      reason: It runs on consumers' runners, which have no Nix.
    - step: .github/workflows/lint.yml::run-lints
      reason: It runs on consumers' runners, which have no Nix.
    - step: .github/workflows/lint.yml::verdict
      reason: It runs on consumers' runners, which have no Nix.
check-issue-numbers:
  exempt:
    - path: internal/issuerefs/*_test.go
      reason: The lint's own tests hold issue references as the input they scan.
    - path: test/check-workflow-hermetic.bats
      match: 'step #[0-9]'
      reason: check-workflow-hermetic names an unnamed step by its index, and these lines assert that output.
check-coverage-drop:
  reports:
    - format: go
      path: .coverage/go/coverage.out
    - format: cobertura
      path: .coverage/bats/bats/cobertura.xml
check-patch-coverage:
  reports:
    - format: go
      path: .coverage/go/coverage.out
    - format: cobertura
      path: .coverage/bats/bats/cobertura.xml
