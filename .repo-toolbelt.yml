check-workflow-hermetic:
  exempt:
    - step: .github/actions/setup/action.yml::root-devshell
      reason: It roots the devShell closure for the Nix cache, using the nix the installer action put on PATH.
    - step: .github/workflows/ci.yml::verdict
      reason: It only compares the needed jobs' results, and its job installs no Nix.
check-issue-numbers:
  exempt:
    - path: internal/issuerefs/*_test.go
      reason: The lint's own tests hold issue references as the input they scan.
    - path: test/check-workflow-hermetic.bats
      match: 'step #[0-9]'
      reason: check-workflow-hermetic names an unnamed step by its index, and these lines assert that output.
