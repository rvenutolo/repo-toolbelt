name: release
# Propose a release, publish one, or prove that the release image still
# builds.
#
# propose holds one pull request open whenever something releasable has
# merged since the last release, titled chore(release): vX.Y.Z, that changes
# CHANGELOG.md and nothing else. The version is computed from the Conventional
# Commit types merged since the last tag, unless the version input names one.
# Merging that pull request is the release decision, so nothing here enables
# auto-merge: a human reads the section and merges it.
#
# publish is what that merge sets off. It asks whether the newest version in
# CHANGELOG.md has a tag. When it has none and the pushed commit is the one
# that brought the version in, the merge of the release pull request, the job
# builds the image with Nix, pushes it to GHCR under the version, attests its
# build provenance against the digest the registry holds, and publishes the
# release, which creates the tag on that commit. Only that commit's own run
# does this: the attestation records the commit a run started from, so a run
# of any other commit would vouch for the wrong one.
#
# dry-run builds the image the way the tests do and uploads it as a workflow
# artifact. It proves the build; nothing is pushed, tagged or published. With
# sign as well, dry-run-signed attests that archive too, for trying the
# attestation step from a branch.
on:
  # TODO: add `push: branches: [main]` once the REFRESH_TOKEN secret exists
  # and releases are wanted. Until then propose runs only by hand, and
  # publish, which runs only on a push, never runs.
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Propose this version (vX.Y.Z) instead of the computed one. Ignored when dry-run is set. A run from a branch other than the default one proposes nothing.
        type: string
        required: false
        default: ""
      dry-run:
        description: Build the image as a workflow artifact; no pull request.
        type: boolean
        default: false
      sign:
        description: >-
          With dry-run, also attest the image archive. Each such run writes a public transparency-log entry that cannot be removed. For a trial from a branch: on the default branch a run with dry-run and sign does nothing. Ignored without dry-run.
        type: boolean
        default: false
permissions: {}
concurrency:
  # propose and publish both act on the one release in progress, so every run
  # that may hold either job shares a group and they run one at a time. Every
  # other run writes no branch, tag, image or release and goes to a group of
  # its own, so a dry run cannot take the one pending place of a queued
  # proposal or publish. A push has no inputs, so inputs.dry-run is empty
  # there, which is false: a push to the default branch lands in the release
  # group.
  group: ${{ github.workflow }}-${{ !inputs.dry-run && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && 'release' || 'dry-run' }}
  cancel-in-progress: false
jobs:
  propose:
    name: propose
    # On a push, or on a run started by hand that is not a dry run; the
    # default branch only, in both cases. The script itself refuses a checkout
    # that is not the default branch's head, before any write. This condition
    # means a run from a side branch spends no setup time and never puts
    # REFRESH_TOKEN in a job's environment.
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name == 'push' || !inputs.dry-run) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # contents: read is for actions/checkout and nothing else. The pull
    # request is opened with REFRESH_TOKEN: one opened with the built-in token
    # triggers no checks, so it could never satisfy the required ones.
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >-
            api.github.com:443 cache.nixos.org:443 channels.nixos.org:443 codeload.github.com:443 github.com:443 hosted-compute-*.githubapp.com:443 install.determinate.systems:443 nixos.org:443 objects.githubusercontent.com:443 proxy.golang.org:443 raw.githubusercontent.com:443 releases.nixos.org:443 storage.googleapis.com:443 sum.golang.org:443 tarballs.nixos.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The next version is computed from the tags and the history since
          # the last one, so the clone must be complete.
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      # `$/` waits on actionlint support; this job runs its own commit, so `./` is the same tree.
      - uses: ./.github/actions/setup # zizmor: ignore[self-repository]
      - name: Open or update the release pull request
        env:
          # REFRESH_TOKEN reaches this repository alone, with Contents and
          # Pull requests write and nothing else.
          GH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          # The input reaches the script as an argument built here, in the
          # runner's shell: .ci/in-devshell drops every variable it does not
          # list, and interpolating the input into the script text would let
          # it run as code.
          VERSION: ${{ inputs.version }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          args=()
          # A newer push can move the default branch on before this step
          # runs; that push has a run of its own. A run started by hand keeps
          # the failure.
          if [[ "${GITHUB_EVENT_NAME}" == 'push' ]]; then
            args+=(--skip-if-stale)
          fi
          if [[ -n "${VERSION}" ]]; then
            args+=(--version "${VERSION}")
          fi
          ./.ci/in-devshell ./.ci/release-pull-request "${args[@]}"
  publish:
    name: publish
    # A push to the default branch and nothing else: a run started by hand
    # never publishes, from any branch.
    if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The only job that can write a release or the image, and the only place
    # these are granted together. The built-in token does it, not
    # REFRESH_TOKEN: a release published with it starts no other workflow,
    # and it is gone when the job ends.
    permissions:
      contents: write # the release and its tag
      packages: write # the image on GHCR
      id-token: write # the OIDC token Sigstore certifies for the attestation
      attestations: write # storing the provenance attestation
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          # Beyond the build's hosts: ghcr.io and pkg-containers take the
          # image; the sigstore.dev hosts issue the certificate, log the
          # attestation, serve the trust root and countersign.
          allowed-endpoints: >-
            api.github.com:443 cache.nixos.org:443 channels.nixos.org:443 codeload.github.com:443 fulcio.sigstore.dev:443 ghcr.io:443 github.com:443 hosted-compute-*.githubapp.com:443 install.determinate.systems:443 nixos.org:443 objects.githubusercontent.com:443 pkg-containers.githubusercontent.com:443 proxy.golang.org:443 raw.githubusercontent.com:443 rekor.sigstore.dev:443 releases.nixos.org:443 storage.googleapis.com:443 sum.golang.org:443 tarballs.nixos.org:443 timestamp.sigstore.dev:443 tuf-repo-cdn.sigstore.dev:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Whether this commit is the one that brought the version into the
          # changelog is read from the history.
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      # `$/` waits on actionlint support; this job runs its own commit, so `./` is the same tree.
      - uses: ./.github/actions/setup # zizmor: ignore[self-repository]
      # Three answers. No release is waiting: the steps below are skipped.
      # One is waiting and this run's commit is its release commit: they run,
      # and sha is this commit. One is waiting and this is another commit:
      # the step fails and names the run to run again.
      - name: Ask whether a release is waiting
        id: pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.ci/in-devshell ./.ci/release-publish pending >> "${GITHUB_OUTPUT}"
      # release-image reads its version from CHANGELOG.md's first heading,
      # which on this commit is the version pending named.
      - name: Build the image
        if: steps.pending.outputs.publish == 'true'
        # The build has no use for the OIDC token request, so it cannot reach
        # it: only the attestation is to hold an identity.
        run: >-
          env --unset=ACTIONS_ID_TOKEN_REQUEST_URL --unset=ACTIONS_ID_TOKEN_REQUEST_TOKEN ./.ci/in-devshell nix build .#release-image --out-link result-image
      # Written where both skopeo and the attestation action read registry
      # credentials.
      - name: Log in to GHCR
        if: steps.pending.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          mkdir --parents "${HOME}/.docker"
          printf '%s' "${GH_TOKEN}" | ./.ci/in-devshell skopeo login ghcr.io --username "${GITHUB_ACTOR}" \
            --password-stdin --authfile "${HOME}/.docker/config.json"
      - name: Push the image
        id: push
        if: steps.pending.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.pending.outputs.version }}
        run: >-
          ./.ci/in-devshell ./.ci/release-publish push-image --version "${VERSION}" --image ./result-image >> "${GITHUB_OUTPUT}"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: steps.pending.outputs.publish == 'true'
        with:
          subject-name: ghcr.io/rvenutolo/repo-toolbelt
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      # Last, because it is the one step that cannot be taken back: the image
      # and its attestation exist before the tag does.
      - name: Publish the release
        if: steps.pending.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.pending.outputs.version }}
          DIGEST: ${{ steps.push.outputs.digest }}
          # This run's own commit; pending answers with no other.
          SHA: ${{ steps.pending.outputs.sha }}
        run: >-
          ./.ci/in-devshell ./.ci/release-publish release --version "${VERSION}" --digest "${DIGEST}" --sha "${SHA}"
  dry-run:
    name: dry-run
    # From any branch: it writes nothing. With the sign input the other dry
    # run takes over, so this job never holds a permission to attest.
    if: ${{ inputs.dry-run && !inputs.sign }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >-
            api.github.com:443 cache.nixos.org:443 channels.nixos.org:443 codeload.github.com:443 github.com:443 hosted-compute-*.githubapp.com:443 install.determinate.systems:443 nixos.org:443 objects.githubusercontent.com:443 proxy.golang.org:443 raw.githubusercontent.com:443 releases.nixos.org:443 results-receiver.actions.githubusercontent.com:443 storage.googleapis.com:443 sum.golang.org:443 tarballs.nixos.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `$/` waits on actionlint support; this job runs its own commit, so `./` is the same tree.
      - uses: ./.github/actions/setup # zizmor: ignore[self-repository]
      - name: Build the image
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          ./.ci/in-devshell nix build .#image --out-link result-image
          ./.ci/in-devshell ./result-image > repo-toolbelt-image.tar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repo-toolbelt-image
          path: repo-toolbelt-image.tar
          # An empty upload would pass while proving nothing.
          if-no-files-found: error
          # The image is for a look, not for keeping.
          retention-days: 7
  dry-run-signed:
    name: dry-run-signed
    # The dry run plus the attestation, for trying it from a branch. Never on
    # the default branch: an attestation made there carries the identity a
    # real release has. It pushes, tags and publishes nothing, and has no
    # permission to; what it does leave behind, for good, is a
    # transparency-log entry naming the branch it ran from.
    if: ${{ inputs.dry-run && inputs.sign && github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # actions/checkout
      id-token: write # the OIDC token Sigstore certifies
      attestations: write # storing the provenance attestation
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >-
            api.github.com:443 cache.nixos.org:443 channels.nixos.org:443 codeload.github.com:443 fulcio.sigstore.dev:443 github.com:443 hosted-compute-*.githubapp.com:443 install.determinate.systems:443 nixos.org:443 objects.githubusercontent.com:443 proxy.golang.org:443 raw.githubusercontent.com:443 rekor.sigstore.dev:443 releases.nixos.org:443 results-receiver.actions.githubusercontent.com:443 storage.googleapis.com:443 sum.golang.org:443 tarballs.nixos.org:443 timestamp.sigstore.dev:443 tuf-repo-cdn.sigstore.dev:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `$/` waits on actionlint support; this job runs its own commit, so `./` is the same tree.
      - uses: ./.github/actions/setup # zizmor: ignore[self-repository]
      - name: Build the image
        # The build has no use for the OIDC token request, so it cannot reach
        # it: only the attestation is to hold an identity.
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          env --unset=ACTIONS_ID_TOKEN_REQUEST_URL --unset=ACTIONS_ID_TOKEN_REQUEST_TOKEN \
            ./.ci/in-devshell nix build .#image --out-link result-image
          ./.ci/in-devshell ./result-image > repo-toolbelt-image.tar
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: repo-toolbelt-image.tar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repo-toolbelt-image
          path: repo-toolbelt-image.tar
          if-no-files-found: error
          retention-days: 7
