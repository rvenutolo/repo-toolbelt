extends: default
rules:
  document-start: disable
  # harden-runner's `allowed-endpoints` lists have to be one space-separated
  # line and cannot be wrapped: a folded scalar is collapsed back onto a single
  # line by the formatter, and a literal block is parsed as one giant endpoint.
  # A list longer than the limit sits between `# yamllint disable
  # rule:line-length` and `# yamllint enable rule:line-length` comments.
  line-length:
    max: 600
  truthy:
    check-keys: false
  comments:
    min-spaces-from-content: 1
# The config loader's fixtures are deliberately invalid YAML (duplicate keys,
# syntax errors) that the loader must reject.
ignore: |
  internal/config/testdata/
